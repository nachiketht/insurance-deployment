[project]
name = "risk-agent-deploy"
version = "0.1.0"
description = "Week 9 lab: Week 8 risk scoring agent, deployed to a simulated AWS (simaws) and a simulated on-prem (Ollama)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "httpx"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
